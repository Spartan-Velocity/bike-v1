name: C++ CI

on:
  pull_request:
  push:
    branches:
      - main
      - new-layout

# The PlatformIO project lives in Firmware/vcu, not the repo root.
defaults:
  run:
    working-directory: Firmware/vcu

jobs:
  format:
    name: Check formatting (clang-format)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --version

      - name: Check C++ formatting
        run: |
          find src include -type f \( -name '*.hpp' -o -name '*.h' -o -name '*.cpp' -o -name '*.c' \) -print0 \
            | xargs -0 clang-format -style=file -n -Werror

  build:
    name: Build firmware (PlatformIO)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('Firmware/vcu/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e teensy41

      # clang-tidy has to parse the ARM/Teensy compile commands, which is fragile on a stock
      # runner, so it reports findings but never fails the build.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Run clang-tidy (non-blocking)
        continue-on-error: true
        run: |
          DB=$(find .pio -name compile_commands.json | head -n 1)
          if [ -z "$DB" ]; then
            echo "compile_commands.json not found under .pio"
            exit 1
          fi
          echo "using $DB"
          clang-tidy -p "$(dirname "$DB")" --config-file=.clang-tidy src/*.cpp